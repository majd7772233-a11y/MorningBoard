name: Build MorningBoard Android APK

on:
  # The APK embeds the current website snapshot, so rebuild on every main push.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morningboard-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build signed Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false

      - name: Accept SDK licenses and install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Prepare offline website snapshot
        run: bash android/prepare-offline-assets.sh

      - name: Prepare release signing key
        shell: bash
        env:
          MY_KEYSTORE_JKS: ${{ secrets.MY_KEYSTORE_JKS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          set +x

          for secret_name in MY_KEYSTORE_JKS KEYSTORE_PASSWORD KEY_ALIAS; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: ${secret_name}"
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/morningboard-release.jks"
          if ! printf '%s' "$MY_KEYSTORE_JKS" | base64 --decode > "$key_path"; then
            echo "::error::MY_KEYSTORE_JKS must contain the Base64-encoded JKS keystore."
            exit 1
          fi

          chmod 600 "$key_path"
          if ! keytool -list -keystore "$key_path" \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
              >/dev/null 2>&1; then
            rm -f "$key_path"
            echo "::error::The JKS, store password, or key alias could not be validated."
            exit 1
          fi

          echo "MY_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build debug and signed release APKs
        env:
          MY_KEYSTORE_PATH: ${{ runner.temp }}/morningboard-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEY_PASSWORD" ]]; then
            echo "::error::Required GitHub Actions secret is missing: KEY_PASSWORD"
            exit 1
          fi
          gradle --no-daemon --stacktrace -p android assembleDebug assembleRelease

      - name: Verify local app entry and bundled code inside APKs
        run: |
          set -euo pipefail
          debug_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          release_apk="android/app/build/outputs/apk/release/app-release.apk"

          for apk in "$debug_apk" "$release_apk"; do
            test -s "$apk"
            unzip -Z1 "$apk" | grep -Fx "assets/index.html"
            unzip -Z1 "$apk" | grep -Fx "assets/styles.css"
            unzip -Z1 "$apk" | grep -Fx "assets/src/main.js"
            unzip -Z1 "$apk" | grep -Fx "assets/src/canvas-manager.js"
            unzip -Z1 "$apk" | grep -Fx "assets/vendor/firebase-app-compat.js"
            unzip -Z1 "$apk" | grep -Fx "assets/vendor/firebase-database-compat.js"
            unzip -Z1 "$apk" | grep -Fx "assets/vendor/morningboard-fonts.css"
          done

          # The installed APK must explicitly enter the packaged HTML document, not the empty directory URL.
          grep -F 'https://majd7772233-a11y.github.io/MorningBoard/index.html' \
            android/app/src/main/java/com/magd/morningboard/MainActivity.java

      - name: Verify APK signatures and application identity
        run: |
          set -euo pipefail
          debug_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          release_apk="android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$release_apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$release_apk" | grep -F "com.magd.morningboard"
          sha256sum "$debug_apk" "$release_apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MorningBoard-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: MorningBoard-Android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/morningboard-release.jks"
