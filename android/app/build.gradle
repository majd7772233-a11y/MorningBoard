plugins {
    id "com.android.application"
}

android {
    namespace "com.magd.morningboard"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.magd.morningboard"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            // Credentials are injected from protected GitHub Actions secrets only.
            def signingStorePath = System.getenv("MY_KEYSTORE_PATH")
            storeFile = signingStorePath != null
                    ? file(signingStorePath)
                    : file("release-keystore.jks")
            storePassword = System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias = System.getenv("KEY_ALIAS") ?: ""
            keyPassword = System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    // API 23 compatible, preserving Android 6 support.
    implementation "androidx.webkit:webkit:1.15.0"
}
