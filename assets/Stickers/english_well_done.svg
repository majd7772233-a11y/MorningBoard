<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="wdBg" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </radialGradient>
    <linearGradient id="wdGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="wdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#134e4a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ribbons -->
  <polygon points="65,142 38,186 66,174 90,186 80,142" fill="#0f766e" />
  <polygon points="135,142 162,186 134,174 110,186 120,142" fill="#115e59" />

  <!-- Badge Body -->
  <g filter="url(#wdShadow)">
    <circle cx="100" cy="95" r="82" fill="url(#wdGold)" />
    <circle cx="100" cy="95" r="75" fill="#f0fdfa" />
    <circle cx="100" cy="95" r="70" fill="url(#wdBg)" stroke="#ffffff" stroke-width="3" />
    <circle cx="100" cy="95" r="64" fill="none" stroke="#99f6e4" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- Target / Bullseye Icon -->
  <circle cx="100" cy="52" r="14" fill="#ffffff" />
  <circle cx="100" cy="52" r="10" fill="#0d9488" />
  <circle cx="100" cy="52" r="6" fill="#ffffff" />
  <circle cx="100" cy="52" r="3" fill="#ef4444" />

  <!-- English Text -->
  <text x="100" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">WELL</text>
  <text x="100" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1.5">DONE!</text>

  <!-- Subtitle pill -->
  <rect x="52" y="128" width="96" height="18" rx="9" fill="#ffffff" />
  <text x="100" y="141" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#0f766e" text-anchor="middle">PERFECT SCORE 🎯</text>
</svg>
