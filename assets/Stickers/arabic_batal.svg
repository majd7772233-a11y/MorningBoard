<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="batalGold" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="65%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </radialGradient>
    <linearGradient id="redRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="batalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#713f12" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ribbons Behind -->
  <polygon points="65,140 36,188 66,174 92,188 80,140" fill="url(#redRibbon)" />
  <polygon points="135,140 164,188 134,174 108,188 120,140" fill="#991b1b" />

  <!-- Medal Outer Body -->
  <g filter="url(#batalShadow)">
    <circle cx="100" cy="95" r="82" fill="url(#batalGold)" />
    <circle cx="100" cy="95" r="74" fill="#ffffff" />
    <circle cx="100" cy="95" r="70" fill="url(#batalGold)" />
    <!-- Laurel Wreath -->
    <circle cx="100" cy="95" r="62" fill="#fffbeb" />
  </g>

  <!-- Trophy Icon -->
  <g fill="#eab308" stroke="#ca8a04" stroke-width="1.5">
    <path d="M88,44 L112,44 L108,62 Q106,72 100,72 Q94,72 92,62 Z" fill="#facc15" />
    <!-- Handles -->
    <path d="M89,48 C80,48 80,62 90,62" fill="none" stroke="#ca8a04" stroke-width="2.5" />
    <path d="M111,48 C120,48 120,62 110,62" fill="none" stroke="#ca8a04" stroke-width="2.5" />
    <!-- Base -->
    <rect x="96" y="72" width="8" height="6" fill="#ca8a04" />
    <rect x="92" y="78" width="16" height="5" rx="2" fill="#a16207" />
  </g>

  <!-- Arabic Text "بطل الصف" -->
  <text x="100" y="112" font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" font-size="28" font-weight="900" fill="#78350f" text-anchor="middle">بَطَـلُ الصَّـف</text>

  <!-- Subtitle -->
  <rect x="58" y="122" width="84" height="20" rx="10" fill="url(#redRibbon)" />
  <text x="100" y="136" font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">المركز الأول 🥇</text>
</svg>
