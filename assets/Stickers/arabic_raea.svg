<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="raeaBg" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="60%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </radialGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="raeaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#4c1d95" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ribbons -->
  <polygon points="65,142 38,186 66,174 90,186 80,142" fill="#7e22ce" />
  <polygon points="135,142 162,186 134,174 110,186 120,142" fill="#581c87" />

  <!-- Badge Body -->
  <g filter="url(#raeaShadow)">
    <circle cx="100" cy="95" r="82" fill="url(#goldEdge)" />
    <circle cx="100" cy="95" r="75" fill="#faf5ff" />
    <circle cx="100" cy="95" r="70" fill="url(#raeaBg)" stroke="#ffffff" stroke-width="3" />
    <circle cx="100" cy="95" r="64" fill="none" stroke="#e9d5ff" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- Sparkles -->
  <polygon points="100,40 102,48 108,50 102,52 100,60 98,52 92,50 98,48" fill="#fef08a" />
  <circle cx="75" cy="56" r="3" fill="#fef08a" />
  <circle cx="125" cy="56" r="3" fill="#fef08a" />

  <!-- Arabic Text "رائع جداً" -->
  <text x="100" y="104" font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">رَائِـع جِـدّاً</text>

  <!-- Subtitle -->
  <rect x="55" y="118" width="90" height="20" rx="10" fill="url(#goldEdge)" />
  <text x="100" y="132" font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" font-size="12" font-weight="800" fill="#4c1d95" text-anchor="middle">مستوى مبهر ✨</text>
</svg>
