<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="ahsantBg" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <linearGradient id="ahsantRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="ahsantShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#075985" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Bottom Ribbons -->
  <polygon points="65,142 38,186 66,174 90,186 80,142" fill="#0369a1" />
  <polygon points="135,142 162,186 134,174 110,186 120,142" fill="#075985" />

  <!-- Main Circular Badge -->
  <g filter="url(#ahsantShadow)">
    <circle cx="100" cy="95" r="82" fill="#f0f9ff" stroke="#38bdf8" stroke-width="3" />
    <circle cx="100" cy="95" r="74" fill="url(#ahsantBg)" stroke="#ffffff" stroke-width="4" />
    <circle cx="100" cy="95" r="66" fill="none" stroke="#bae6fd" stroke-width="2" stroke-dasharray="5,4" />
  </g>

  <!-- Top Badge Icon: Big Crisp Checkmark Circle -->
  <circle cx="100" cy="54" r="16" fill="#22c55e" stroke="#ffffff" stroke-width="3" />
  <path d="M92,54 L98,60 L108,48" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Arabic Text "أحسنت" -->
  <text x="100" y="112" font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">أَحْسَـنْتَ</text>

  <!-- Subtitle banner -->
  <rect x="52" y="122" width="96" height="20" rx="10" fill="#ffffff" />
  <text x="100" y="136" font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" font-size="12" font-weight="800" fill="#0369a1" text-anchor="middle">إجابة رائعة 👏</text>
</svg>
