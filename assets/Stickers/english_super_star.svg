<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="starCosmic" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </radialGradient>
    <linearGradient id="goldStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="ssShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1e1b4b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ribbons -->
  <polygon points="65,142 38,186 66,174 90,186 80,142" fill="#eab308" />
  <polygon points="135,142 162,186 134,174 110,186 120,142" fill="#ca8a04" />

  <!-- Badge Body -->
  <g filter="url(#ssShadow)">
    <circle cx="100" cy="95" r="82" fill="url(#goldStarGrad)" />
    <circle cx="100" cy="95" r="75" fill="#ffffff" />
    <circle cx="100" cy="95" r="70" fill="url(#starCosmic)" stroke="#ffffff" stroke-width="2" />
    <circle cx="100" cy="95" r="64" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- Star at Top -->
  <polygon points="100,34 104,46 117,47 107,56 110,68 100,61 90,68 93,56 83,47 96,46" fill="url(#goldStarGrad)" stroke="#ffffff" stroke-width="1.5" />

  <!-- English Text -->
  <text x="100" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SUPER</text>
  <text x="100" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="1.5">STAR!</text>

  <!-- Sparkles -->
  <circle cx="56" cy="94" r="2.5" fill="#fde047" />
  <circle cx="144" cy="94" r="2.5" fill="#fde047" />

  <!-- Subtitle pill -->
  <rect x="52" y="128" width="96" height="18" rx="9" fill="url(#goldStarGrad)" />
  <text x="100" y="141" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#312e81" text-anchor="middle">TOP PERFORMER 🌟</text>
</svg>
