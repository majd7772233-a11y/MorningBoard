<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="mumtazBadge" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fcd34d" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="mDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Bottom Ribbons -->
  <polygon points="68,140 40,185 68,172 92,185 82,140" fill="#d97706" />
  <polygon points="132,140 160,185 132,172 108,185 118,140" fill="#b45309" />

  <!-- Main Scalloped Stamp Outer -->
  <g filter="url(#mDrop)">
    <circle cx="100" cy="95" r="82" fill="url(#goldRibbon)" />
    <circle cx="100" cy="95" r="75" fill="#ffffff" />
    <circle cx="100" cy="95" r="70" fill="url(#mumtazBadge)" />
    <!-- Inner dashed stitch ring -->
    <circle cx="100" cy="95" r="64" fill="none" stroke="#fcd34d" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- Stars at top -->
  <g fill="#fcd34d">
    <!-- Center star -->
    <polygon points="100,42 103,50 111,51 105,57 107,65 100,60 93,65 95,57 89,51 97,50" />
    <!-- Left star -->
    <polygon points="76,48 78,54 84,55 79,60 81,66 76,62 71,66 73,60 68,55 74,54" transform="rotate(-15 76 57)" />
    <!-- Right star -->
    <polygon points="124,48 126,54 132,55 127,60 129,66 124,62 119,66 121,60 116,55 122,54" transform="rotate(15 124 57)" />
  </g>

  <!-- Arabic Text "ممتاز" -->
  <text x="100" y="112" font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">مُـمْتَـاز</text>

  <!-- Subtitle banner -->
  <rect x="52" y="122" width="96" height="20" rx="10" fill="url(#goldRibbon)" stroke="#ffffff" stroke-width="1.5" />
  <text x="100" y="136" font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" font-size="12" font-weight="800" fill="#78350f" text-anchor="middle">درجة كاملة ★</text>
</svg>
