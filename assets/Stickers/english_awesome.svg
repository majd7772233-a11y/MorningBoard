<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="aweBg" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>
    <linearGradient id="aweGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="50%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="aweShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#7c2d12" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ribbons -->
  <polygon points="65,142 38,186 66,174 90,186 80,142" fill="#ea580c" />
  <polygon points="135,142 162,186 134,174 110,186 120,142" fill="#c2410c" />

  <!-- Badge Body -->
  <g filter="url(#aweShadow)">
    <circle cx="100" cy="95" r="82" fill="#fff7ed" stroke="#f97316" stroke-width="3" />
    <circle cx="100" cy="95" r="74" fill="url(#aweBg)" stroke="#ffffff" stroke-width="4" />
    <circle cx="100" cy="95" r="66" fill="none" stroke="#fed7aa" stroke-width="2" stroke-dasharray="5,4" />
  </g>

  <!-- Rocket Icon -->
  <g fill="#ffffff" transform="translate(86, 36) scale(0.95)">
    <path d="M14.5 2C14.5 2 11 3 8 6C5 9 4 12.5 4 12.5L2 14.5L6.5 15.5L7.5 20L9.5 18C9.5 18 13 17 16 14C19 11 20 7.5 20 7.5L14.5 2Z" />
    <circle cx="13" cy="9" r="2" fill="#ea580c" />
  </g>

  <!-- English Text -->
  <text x="100" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">AWESOME!</text>

  <!-- Subtitle pill -->
  <rect x="52" y="120" width="96" height="20" rx="10" fill="#ffffff" />
  <text x="100" y="134" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#c2410c" text-anchor="middle">ROCKET STAR 🚀</text>
