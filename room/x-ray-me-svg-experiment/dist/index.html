<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>الفحص بالأشعة السينية | Interactive X-Ray Scanner</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Top Interactive HUD Bar -->
    <header class="xray-header-bar">
      <div class="hud-left">
        <span class="badge pulse-badge">📡 فحص حي مباشر</span>
        <span class="badge info-badge" id="hud-zone">المنطقة: الصدر والقلب (Thorax)</span>
      </div>
      <div class="hud-center">
        <h1 class="hud-title">فحص الجسم بالأشعة السينية <span>X-RAY SCANNER</span></h1>
      </div>
      <div class="hud-right">
        <button id="btn-zoom-in" class="hud-btn" title="تكبير العدسة">+</button>
        <button id="btn-zoom-out" class="hud-btn" title="تصغير العدسة">−</button>
        <button id="btn-reset-pos" class="hud-btn" title="إعادة تعيين للمركز">⟲</button>
      </div>
    </header>

    <!-- LAYER 1: EXTERNAL BODY (SVG) -->
    <svg id="svg-outer" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Clinical Room Ambient Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="50%" stop-color="#f8fafc"/>
          <stop offset="100%" stop-color="#f1f5f9"/>
        </linearGradient>

        <filter id="dropBlur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="5"/>
        </filter>
      </defs>

      <!-- Background -->
      <rect width="800" height="1000" fill="url(#bgGrad)"/>
      
      <!-- High-Tech Medical Backdrop Grid -->
      <g stroke="#94a3b8" stroke-width="0.5" opacity="0.25">
        <line x1="0" y1="150" x2="800" y2="150"/>
        <line x1="0" y1="300" x2="800" y2="300"/>
        <line x1="0" y1="450" x2="800" y2="450"/>
        <line x1="0" y1="600" x2="800" y2="600"/>
        <line x1="0" y1="750" x2="800" y2="750"/>
        <line x1="0" y1="900" x2="800" y2="900"/>
        <line x1="150" y1="0" x2="150" y2="1000"/>
        <line x1="300" y1="0" x2="300" y2="1000"/>
        <line x1="450" y1="0" x2="450" y2="1000"/>
        <line x1="600" y1="0" x2="600" y2="1000"/>
        <line x1="750" y1="0" x2="750" y2="1000"/>
      </g>

      <!-- External Body Character Art -->
