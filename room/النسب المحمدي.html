<!--
  Family of Prophet Muhammad - 3D Interactive System
-->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عائلة النبي محمد ﷺ - نظام تفاعلي ثلاثي الأبعاد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  background: #000;
  font-family: 'Cairo', 'Tahoma', sans-serif;
  color: #fff;
  user-select: none;
}
#canvas-container { position: fixed; inset: 0; z-index: 1; }
#canvas-container canvas { display: block; cursor: grab; }
#canvas-container canvas:active { cursor: grabbing; }

#loading {
  position: fixed; inset: 0; background: #000;
  display: flex; align-items: center; justify-content: center;
  z-index: 100; transition: opacity 1s ease;
}
.loading-content { text-align: center; }
.loading-orb {
  width: 70px; height: 70px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #c8a84e, #8B6914);
  margin: 0 auto 24px;
  animation: pulse 1.5s ease infinite;
  box-shadow: 0 0 60px #c8a84e, 0 0 120px rgba(200,168,78,0.4);
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}
.loading-text {
  font-size: 16px; color: rgba(200, 168, 78, 0.8);
  letter-spacing: 3px; font-weight: 600;
}

#title-panel {
  position: fixed; top: 20px; right: 20px;
  text-align: right;
  z-index: 10; pointer-events: none;
}
#title-panel h1 {
  font-size: 26px; font-weight: 900;
  background: linear-gradient(90deg, #ffd700, #c8a84e, #e8d5a0, #ffd700);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 3px;
  animation: shimmer 4s linear infinite;
}
@keyframes shimmer { to { background-position: 200% center; } }
#title-panel .subtitle {
  font-size: 13px; color: rgba(255, 255, 255, 0.4);
  margin-top: 6px; letter-spacing: 1px;
}

#lock-btn {
  position: fixed; top: 20px; left: 20px;
  z-index: 15; pointer-events: all;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.7);
  width: 42px; height: 42px; border-radius: 50%;
  cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s ease;
}
#lock-btn:hover {
  background: rgba(200,168,78,0.12);
  border-color: rgba(200,168,78,0.3);
  color: #ffd700;
}
#lock-btn.locked {
  background: rgba(255,80,80,0.15);
  border-color: rgba(255,80,80,0.4);
  color: #ff6666;
  box-shadow: 0 0 12px rgba(255,80,80,0.15);
}

.panel {
  background: rgba(8, 10, 24, 0.72);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(100, 130, 255, 0.12);
  border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
}

#controls-panel {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 10px; align-items: center;
  padding: 10px 16px; z-index: 10;
  flex-wrap: wrap; justify-content: center;
}
.ctrl-btn {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.75);
  padding: 8px 14px; border-radius: 8px;
  cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 600;
  transition: all 0.2s ease; white-space: nowrap;
}
.ctrl-btn:hover {
  background: rgba(200, 168, 78, 0.12);
  border-color: rgba(200, 168, 78, 0.3);
  color: #ffd700;
}
.ctrl-btn.active {
  background: rgba(200, 168, 78, 0.18);
  border-color: rgba(200, 168, 78, 0.4);
  color: #ffd700;
  box-shadow: 0 0 12px rgba(200, 168, 78, 0.15);
}
.speed-control {
  display: flex; align-items: center; gap: 8px;
  padding: 0 6px;
}
.speed-control label {
  font-size: 13px; color: rgba(255, 255, 255, 0.5); font-weight: 600;
}
.speed-control input[type="range"] {
  width: 100px; height: 4px;
  -webkit-appearance: none; appearance: none;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 2px; outline: none;
}
.speed-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: #c8a84e; cursor: pointer;
  box-shadow: 0 0 8px rgba(200, 168, 78, 0.6);
}
.speed-control input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: #c8a84e; cursor: pointer; border: none;
  box-shadow: 0 0 8px rgba(200, 168, 78, 0.6);
}
#speed-value {
  font-size: 12px; color: #c8a84e;
  min-width: 35px; text-align: center; font-weight: 700;
}

#toggle-panel {
  position: fixed; top: 50%; right: 125px;
  transform: translateY(-50%);
  z-index: 100;
  width: 32px; height: 52px;
  border-radius: 12px 0 0 12px;
  background: rgba(10, 14, 30, 0.95);
  border: 1.5px solid rgba(200,168,78,0.5);
  border-right: none;
  color: #ffd700;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: right 0.4s cubic-bezier(0.4,0,0.2,1), background 0.3s ease, color 0.3s ease;
  pointer-events: all;
  box-shadow: -4px 0 15px rgba(0,0,0,0.5);
  user-select: none;
}
#toggle-panel:hover {
  background: rgba(200,168,78,0.28);
  color: #ffffff;
  border-color: #ffd700;
}
#toggle-panel.panel-closed {
  right: 0px !important;
  background: rgba(200,168,78,0.2);
  border-color: rgba(200,168,78,0.6);
}

.filter-section {
  padding: 6px 4px 2px;
  border-bottom: 1px solid rgba(200,168,78,0.15);
  margin-bottom: 4px;
}
.filter-btn {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.8);
  padding: 5px 8px; border-radius: 6px;
  cursor: pointer; font-family: inherit;
  font-size: 11px; font-weight: 700;
  transition: all 0.2s ease; width: 100%;
  text-align: right;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.filter-btn:hover {
  background: rgba(200, 168, 78, 0.15);
  border-color: rgba(200, 168, 78, 0.3);
  color: #ffd700;
}
.filter-btn.active-filter {
  background: rgba(200, 168, 78, 0.2);
  border-color: rgba(200, 168, 78, 0.5);
  color: #ffd700;
  box-shadow: 0 0 10px rgba(200, 168, 78, 0.15);
}
.filter-dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0; box-shadow: 0 0 6px currentColor;
}

#planet-selector {
  position: fixed; top: 50%; right: 10px;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 4px;
  padding: 6px; z-index: 10; max-height: 82vh;
  width: 115px;
  max-width: 115px;
  overflow-y: auto;
  overflow-x: visible;
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
}
#planet-selector.hidden-panel {
  transform: translateY(-50%) translateX(calc(100% + 15px));
  opacity: 0.95;
}
#planet-selector::-webkit-scrollbar { width: 3px; }
#planet-selector::-webkit-scrollbar-thumb { background: rgba(200,168,78,0.3); border-radius: 2px; }
.planet-btn {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  color: rgba(255, 255, 255, 0.75);
  padding: 5px 8px; border-radius: 6px;
  cursor: pointer; font-family: inherit;
  font-size: 11.5px; font-weight: 600;
  transition: all 0.2s ease; min-width: 0; width: 100%;
  text-align: right;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.planet-btn:hover {
  background: rgba(255, 255, 255, 0.07);
  color: #fff;
  transform: translateX(-4px);
  border-color: rgba(255,255,255,0.12);
}
.planet-btn.selected {
  background: rgba(200, 168, 78, 0.1);
  border-color: rgba(200, 168, 78, 0.35);
  color: #ffd700;
}
.planet-dot {
  width: 10px; height: 10px; border-radius: 50%;
  flex-shrink: 0; box-shadow: 0 0 8px currentColor;
}
.planet-dot.diamond {
  border-radius: 2px;
  transform: rotate(45deg);
  width: 8px; height: 8px;
}

#info-panel {
  position: fixed; top: 50%; left: 20px;
  transform: translateY(-50%) translateX(-120%);
  width: 360px; max-height: 82vh; overflow-y: auto;
  padding: 24px; z-index: 20;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
#info-panel.visible { transform: translateY(-50%) translateX(0); }
#info-panel::-webkit-scrollbar { width: 4px; }
#info-panel::-webkit-scrollbar-thumb { background: rgba(200, 168, 78, 0.3); border-radius: 2px; }
.close-btn {
  position: absolute; top: 12px; left: 12px;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.6);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease; font-family: inherit;
}
.close-btn:hover { background: rgba(255, 80, 80, 0.2); color: #ff6666; border-color: rgba(255,80,80,0.3); }
.info-header {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 16px;
}
.info-icon {
  width: 50px; height: 50px; border-radius: 50%;
  flex-shrink: 0; box-shadow: 0 0 20px currentColor;
}
.info-icon.diamond {
  border-radius: 4px;
}
.info-header h2 {
  font-size: 20px; font-weight: 700; color: #fff;
  letter-spacing: 1px;
}
.info-header .name-en {
  font-size: 11px; color: rgba(255, 255, 255, 0.35);
  text-transform: uppercase; letter-spacing: 2px;
  margin-top: 2px;
}
.info-description {
  font-size: 13.5px; line-height: 1.8;
  color: rgba(255, 255, 255, 0.65);
  margin-bottom: 18px;
}
.stats-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.stat-item {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 8px; padding: 10px 12px;
}
.stat-label {
  font-size: 10.5px; color: rgba(255, 255, 255, 0.35);
  margin-bottom: 4px; font-weight: 600;
}
.stat-value {
  font-size: 13px; color: #ffd700; font-weight: 700;
}

#labels-container {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 8;
}
.planet-label {
  position: absolute; font-size: 13px; font-weight: 900;
  color: #fff;
  text-shadow:
    0 0 4px rgba(0,0,0,1),
    0 0 8px rgba(0,0,0,0.9),
    0 0 14px rgba(0,0,0,0.7),
    0 0 20px rgba(0,0,0,0.5),
    0 0 30px rgba(0,0,0,0.3);
  transform: translate(-50%, -100%);
  white-space: nowrap; letter-spacing: 1px;
  transition: opacity 0.3s ease;
  padding: 3px 10px;
  border-radius: 6px;
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.15);
}
.planet-label.labels-hidden {
  opacity: 0 !important;
}
.planet-label.hover-visible {
  opacity: 1 !important;
}
.mini-moon-label {
  position: absolute; font-size: 9px; font-weight: 700;
  color: rgba(255,220,160,0.9);
  text-shadow:
    0 0 3px rgba(0,0,0,1),
    0 0 6px rgba(0,0,0,0.8),
    0 0 10px rgba(0,0,0,0.6);
  transform: translate(-50%, -50%);
  white-space: nowrap; letter-spacing: 0.5px;
  font-style: italic;
  pointer-events: none;
}
.mini-moon-label.labels-hidden {
  opacity: 0 !important;
}
.mini-moon-label.hover-visible {
  opacity: 1 !important;
}

.orbit-label {
  position: absolute; font-size: 10px; font-weight: 600;
  color: rgba(200, 168, 78, 0.4);
  pointer-events: none; z-index: 4;
  letter-spacing: 2px;
}

#sun-calligraphy-label {
  position: absolute;
  pointer-events: none;
  z-index: 20;
  font-family: 'Amiri', 'Reem Kufi', serif;
  font-size: 32px;
  font-weight: 900;
  color: #fbbf24;
  background: rgba(15, 23, 42, 0.88);
  padding: 6px 22px;
  border-radius: 24px;
  border: 2px solid #fbbf24;
  text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 20px rgba(251,191,36,0.8);
  box-shadow: 0 0 25px rgba(251,191,36,0.5), inset 0 0 12px rgba(251,191,36,0.3);
  transform: translate(-50%, -50%);
  white-space: nowrap;
  direction: rtl;
  letter-spacing: 2px;
  opacity: 1;
}

body.student-device #lock-btn,
body.student-device #theme-picker,
body.student-device #controls-panel,
body.student-device #hint,
body.student-device #title-panel,
body.student-device .top-toolbar {
  display: none !important;
}

#hint {
  position: fixed; bottom: 72px; left: 50%;
  transform: translateX(-50%); font-size: 11px;
  color: rgba(255, 255, 255, 0.25); z-index: 5;
  pointer-events: none; letter-spacing: 0.5px;
}

/* ===== SEARCH (inside side panel) ===== */
#panel-search {
  position: relative; padding: 8px 10px;
}
#panel-search-input {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(200,168,78,0.15);
  border-radius: 10px;
  padding: 9px 12px 9px 34px;
  color: #fff;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  outline: none;
  transition: all 0.3s ease;
  letter-spacing: 0.5px;
}
#panel-search-input::placeholder { color: rgba(255,255,255,0.25); }
#panel-search-input:focus {
  border-color: rgba(200,168,78,0.4);
  background: rgba(255,255,255,0.06);
}
#panel-search-icon {
  position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
  font-size: 14px; color: rgba(200,168,78,0.5); pointer-events: none;
}
#panel-search-results {
  position: absolute; top: 100%; left: 8px; right: 8px;
  background: rgba(8, 10, 24, 0.95);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(200,168,78,0.15);
  border-radius: 10px;
  max-height: 200px;
  overflow-y: auto;
  display: none;
  z-index: 100;
}
#panel-search-results::-webkit-scrollbar { width: 3px; }
#panel-search-results::-webkit-scrollbar-thumb { background: rgba(200,168,78,0.3); border-radius: 2px; }
.panel-search-item {
  padding: 8px 12px;
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 600;
  color: rgba(255,255,255,0.8);
  border-bottom: 1px solid rgba(200,168,78,0.06);
  display: flex; align-items: center; gap: 8px;
  transition: all 0.15s ease;
}
.panel-search-item:hover {
  background: rgba(200,168,78,0.12);
  color: #ffd700;
}
.panel-search-item:last-child { border-bottom: none; }
.panel-search-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}



@media (max-width: 768px) {
  #title-panel h1 { font-size: 18px; letter-spacing: 1.5px; }
  #title-panel .subtitle { font-size: 10px; }
  #planet-selector {
    top: 50%; right: 6px; bottom: auto; left: auto;
    transform: translateY(-50%); flex-direction: column;
    width: 105px !important; max-width: 105px !important;
    max-height: 70vh; padding: 4px; z-index: 99;
  }
  #planet-selector.hidden-panel {
    transform: translateY(-50%) translateX(calc(100% + 15px));
  }
  #toggle-panel {
    right: 111px; width: 30px; height: 48px; font-size: 15px;
  }
  #toggle-panel.panel-closed {
    right: 0px !important;
  }
  .planet-btn { min-width: auto; padding: 4px 6px; font-size: 10px; gap: 4px; }
  .filter-btn { padding: 4px 6px; font-size: 9.5px; }
  #controls-panel { gap: 4px; padding: 6px 10px; bottom: 10px; }
  .ctrl-btn { padding: 5px 8px; font-size: 10px; }
  .speed-control input[type="range"] { width: 50px; }
  .speed-control label { font-size: 10px; }
  #info-panel { width: 92%; left: 4%; max-height: 55vh; padding: 16px; }
  #hint { display: none; }

  #stats-bar { top: auto; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 10px; padding: 6px 14px; }
}

/* ===== STATS BAR ===== */
#stats-bar {
  position: fixed; top: 68px; left: 20px;
  z-index: 10; pointer-events: none;
  display: flex; flex-wrap: wrap; gap: 6px 12px;
  max-width: 420px;
}
.stats-chip {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 600;
  color: rgba(255,255,255,0.55);
  padding: 3px 8px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 6px;
  transition: all 0.4s ease;
}
.stats-chip .chip-dot {
  width: 7px; height: 7px; border-radius: 50%;
  flex-shrink: 0;
}
.stats-chip .chip-count {
  color: #ffd700; font-weight: 800; font-size: 11px;
}

/* ===== STORY MODE ===== */
#story-panel {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 50; display: none;
  pointer-events: none;
}
#story-panel.visible { display: block; }
#story-backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0);
  transition: background 0.8s ease;
  pointer-events: all;
  cursor: pointer;
}
#story-panel.visible #story-backdrop { background: rgba(0,0,0,0.55); }
#story-card {
  position: absolute; bottom: 60px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  opacity: 0;
  width: min(560px, 92%);
  pointer-events: all;
  background: rgba(8,10,24,0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(200,168,78,0.2);
  border-radius: 20px;
  padding: 0;
  overflow: hidden;
  transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(200,168,78,0.08);
}
#story-panel.visible #story-card {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
.story-banner {
  height: 6px; width: 100%;
  border-radius: 0;
}
.story-body {
  padding: 28px 32px 24px;
}
.story-top {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 20px;
}
.story-icon {
  width: 56px; height: 56px; border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 25px currentColor;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
}
.story-icon.diamond { border-radius: 6px; transform: rotate(45deg); }
.story-name {
  font-size: 22px; font-weight: 800; color: #fff;
  letter-spacing: 1.5px; line-height: 1.4;
}
.story-name-en {
  font-size: 11px; color: rgba(255,255,255,0.3);
  text-transform: uppercase; letter-spacing: 2px; margin-top: 3px;
}
.story-relation {
  display: inline-block;
  font-size: 13px; font-weight: 700;
  color: #ffd700;
  padding: 5px 14px;
  background: rgba(200,168,78,0.1);
  border: 1px solid rgba(200,168,78,0.25);
  border-radius: 8px;
  letter-spacing: 1px;
  margin-bottom: 16px;
}
.story-text {
  font-size: 14.5px; line-height: 2;
  color: rgba(255,255,255,0.7);
  max-height: 200px; overflow-y: auto;
  opacity: 0;
  transform: translateY(12px);
  transition: all 0.6s ease 0.3s;
}
#story-panel.visible .story-text {
  opacity: 1; transform: translateY(0);
}
.story-text::-webkit-scrollbar { width: 3px; }
.story-text::-webkit-scrollbar-thumb { background: rgba(200,168,78,0.3); border-radius: 2px; }
.story-stats-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-top: 16px;
  opacity: 0;
  transform: translateY(12px);
  transition: all 0.6s ease 0.5s;
}
#story-panel.visible .story-stats-grid {
  opacity: 1; transform: translateY(0);
}
.story-stat-item {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 10px 14px;
}
.story-stat-label {
  font-size: 10px; color: rgba(255,255,255,0.35);
  font-weight: 600; margin-bottom: 3px;
}
.story-stat-value {
  font-size: 14px; color: #ffd700; font-weight: 800;
}
.story-close-hint {

function createGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,220,120,1)');
  g.addColorStop(0.15, 'rgba(200,168,78,0.7)');
  g.addColorStop(0.4, 'rgba(150,120,50,0.3)');
  g.addColorStop(1, 'rgba(100,80,30,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

const textureCache = {};
function getBodyTexture(type) {
  if (textureCache[type]) return textureCache[type];
  const baseColor = type === 'male' ? '#6688aa' : type === 'female' ? '#aa6688' : '#888888';
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = baseColor; ctx.fillRect(0, 0, 256, 128);
  const img = ctx.getImageData(0, 0, 256, 128);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 30;
    img.data[i] = Math.max(0, Math.min(255, img.data[i] + n));
    img.data[i+1] = Math.max(0, Math.min(255, img.data[i+1] + n));
    img.data[i+2] = Math.max(0, Math.min(255, img.data[i+2] + n));
  }
  ctx.putImageData(img, 0, 0);
  if (type === 'male') {
    for (let i = 0; i < 10; i++) {
      const x = Math.random() * 256, y = Math.random() * 128, r = Math.random() * 15 + 5;
      ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.rect(x, y, r, r); ctx.stroke();
    }
  } else if (type === 'female') {
    for (let i = 0; i < 15; i++) {
      const x = Math.random() * 256, y = Math.random() * 128, r = Math.random() * 12 + 5;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(255,255,255,0.06)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  textureCache[type] = new THREE.CanvasTexture(c);
  return textureCache[type];
}

function createMoonTexture(baseColor) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = baseColor; ctx.fillRect(0, 0, 256, 128);
  const img = ctx.getImageData(0, 0, 256, 128);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 25;
    img.data[i] += n; img.data[i+1] += n; img.data[i+2] += n;
  }
  ctx.putImageData(img, 0, 0);
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * 256, y = Math.random() * 128, r = 2 + Math.random() * 6;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,0.2)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

// ===== STARFIELD (PARALLAX LAYERS) =====
const starLayers = [];
let prevCameraPos = new THREE.Vector3(0, 0, 0);
function createParallaxStarfield(count, minR, maxR, size, opacity) {
  const geo = new THREE.BufferGeometry();
  const pos = [], col = [], sizes = [];
  for (let i = 0; i < count; i++) {
    const r = minR + Math.random() * (maxR - minR);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
    const t = Math.random();
    if (t < 0.6) col.push(1, 1, 1);
    else if (t < 0.78) col.push(0.7, 0.85, 1);
    else if (t < 0.9) col.push(1, 0.9, 0.7);
    else col.push(1, 0.6, 0.4);
    sizes.push(size * (0.5 + Math.random() * 1.0));
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size: size, map: createStarTexture(), vertexColors: true,
    transparent: true, opacity: opacity, sizeAttenuation: true,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  return new THREE.Points(geo, mat);
}

      vec3 c3 = vec3(1.0, 0.95, 0.7);
      vec3 color = mix(c1, c2, n);
      color = mix(color, c3, smoothstep(0.5, 0.8, n));
      float edge = 1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0)));
      color += vec3(1.0, 0.8, 0.3) * pow(edge, 2.0) * 0.4;
      gl_FragColor = vec4(color, 1.0);
    }
  `
});

const allOrbitPaths = [];

function createOrbitRing(distance, colorHex, tiltX, tiltZ, isDashed, lineWidth, opac) {
 const segments = 128;
 const points = [];
 for (let j = 0; j <= segments; j++) {
   const a = (j / segments) * Math.PI * 2;
   points.push(new THREE.Vector3(Math.cos(a) * distance, 0, Math.sin(a) * distance));
 }
 const geo = new THREE.BufferGeometry().setFromPoints(points);
 const mat = new THREE.LineBasicMaterial({
   color: new THREE.Color(colorHex), transparent: true, opacity: opac, depthWrite: false
 });
 const orbit = new THREE.Line(geo, mat);
 if (tiltX) orbit.rotation.x = tiltX;
 if (tiltZ) orbit.rotation.z = tiltZ;
 scene.add(orbit);

 // Glow ring (wider, fainter duplicate)
 const glowMat = new THREE.LineBasicMaterial({
   color: new THREE.Color(colorHex), transparent: true, opacity: opac * 0.25, depthWrite: false
 });
 const glowOrbit = new THREE.Line(geo.clone(), glowMat);
 if (tiltX) glowOrbit.rotation.x = tiltX;
 if (tiltZ) glowOrbit.rotation.z = tiltZ;
 scene.add(glowOrbit);

 allOrbitPaths.push({ orbit, type: 'main' });
 allOrbitPaths.push({ orbit: glowOrbit, type: 'glow' });

 return orbit;
}

const battleAsteroidMeshes = [];
BATTLES_DATA.forEach((data, i) => {
  // Rocky asteroid-like geometry (Icosahedron with low detail + vertex displacement)
  const radius = data.radius || 1.0;
  const astGeo = new THREE.IcosahedronGeometry(radius, 1);
  // Displace vertices randomly for rocky look
  const posArr = astGeo.attributes.position;
  for (let vi = 0; vi < posArr.count; vi++) {
    const vx = posArr.getX(vi);
    const vy = posArr.getY(vi);
    const vz = posArr.getZ(vi);
    const len = Math.sqrt(vx*vx + vy*vy + vz*vz) || 1;
    const noise = 0.7 + Math.random() * 0.6;
    posArr.setXYZ(vi, vx/len * radius * noise, vy/len * radius * noise, vz/len * radius * noise);
  }
  astGeo.computeVertexNormals();

  const astMat = new THREE.MeshStandardMaterial({
    map: getBodyTexture('companion'),
    roughness: 0.95, metalness: 0.05,
    emissive: new THREE.Color(data.colorHex),
    emissiveIntensity: 0.12,
    flatShading: true
  });
  const astMesh = new THREE.Mesh(astGeo, astMat);

  const group = new THREE.Group();

function showInfo(data) {

  const icon = document.getElementById('info-icon');
  icon.style.background = 'radial-gradient(circle at 30% 30%, ' + data.colorHex + ', #000)';
  icon.style.color = data.colorHex;

    icon.style.borderRadius = '6px';

    icon.style.transform = 'none';

  const statsGrid = document.getElementById('info-stats');
  statsGrid.innerHTML = '';
  if (data.stats) {
    Object.entries(data.stats).forEach(([k, v]) => {
      const item = document.createElement('div');

      item.innerHTML = '<div class="stat-label">' + k + '</div><div class="stat-value">' + v + '</div>';

let isSyncingRemoteState = false;
window.mySenderId = 'nasab_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();

function broadcastNasabState(actionType = null, extraData = {}) {
  if (isSyncingRemoteState) return;

  const stateObj = {
    focusedTarget: focusedTarget,
    clickLock: clickLock,
    activeFilter: activeFilter,
    showLabels: showLabels,
    showOrbits: showOrbits,
    isPlaying: isPlaying,
    speedMultiplier: speedMultiplier,
    _senderId: window.mySenderId,
    timestamp: Date.now()
  };

  if (actionType) {
    stateObj.lastAction = Object.assign({
      type: actionType,
      _senderId: window.mySenderId,
      timestamp: Date.now()
    }, extraData);
  }

  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: 'nasab_state_update',
      state: stateObj
    }, '*');
  }
}

}

function selectTarget(targetId, isRemote = false) {
  if (!targetId) return;

  focusedTarget = targetId;

  if (targetId === 'sun') {
    showInfo(SUN_INFO);
  } else if (targetId.startsWith('moon-')) {
    const idx = parseInt(targetId.split('-')[1]);
    if (MOONS_DATA[idx]) showInfo(MOONS_DATA[idx]);
  } else if (targetId.startsWith('child-')) {
    const idx = parseInt(targetId.split('-')[1]);
    if (CHILDREN_DATA[idx]) showInfo(CHILDREN_DATA[idx]);
  } else if (targetId.startsWith('wife-')) {
    const idx = parseInt(targetId.split('-')[1]);
    if (WIVES_DATA[idx]) showInfo(WIVES_DATA[idx]);
  } else if (targetId.startsWith('relative-')) {
    const idx = parseInt(targetId.split('-')[1]);
    if (UNCLES_AUNTS_DATA[idx]) showInfo(UNCLES_AUNTS_DATA[idx]);
  } else if (targetId.startsWith('wetnurse-')) {
    const idx = parseInt(targetId.split('-')[1]);
    if (WET_NURSES_DATA[idx]) showInfo(WET_NURSES_DATA[idx]);
  } else if (targetId.startsWith('mawali-')) {
    const idx = parseInt(targetId.split('-')[1]);
    if (MAWALI_SERVANTS_DATA[idx]) showInfo(MAWALI_SERVANTS_DATA[idx]);
  } else if (targetId.startsWith('scribe-')) {
    const idx = parseInt(targetId.split('-')[1]);
    if (SCRIBES_DATA[idx]) showInfo(SCRIBES_DATA[idx]);
  } else if (targetId.startsWith('closecomp-')) {
    const idx = parseInt(targetId.split('-')[1]);
    if (CLOSE_COMPANIONS_DATA[idx]) showInfo(CLOSE_COMPANIONS_DATA[idx]);
  } else if (targetId.startsWith('promised-')) {
    const idx = parseInt(targetId.split('-')[1]);
    if (PROMISED_PARADISE[idx]) showInfo(PROMISED_PARADISE[idx]);
  } else if (targetId.startsWith('battle-')) {
    const idx = parseInt(targetId.split('-')[1]);
    if (BATTLES_DATA[idx]) showInfo(BATTLES_DATA[idx]);
  }

  buildSelector();

  if (!isRemote) {
    broadcastNasabState('select_target', { targetId: targetId });
  }
}

    return;
  }

  if (e.data.type === 'sync_nasab_state' || e.data.type === 'apply_nasab_state') {
    const state = e.data.state || e.data;
    if (!state) return;

    if (state._senderId && state._senderId === window.mySenderId) return;

    isSyncingRemoteState = true;
    try {
      if (typeof state.clickLock === 'boolean') {
        clickLock = state.clickLock;
        const lockBtn = document.getElementById('lock-btn');
        if (lockBtn) {
          lockBtn.classList.toggle('locked', clickLock);
          lockBtn.textContent = clickLock ? '🔒' : '🔓';
        }
      }
      if (typeof state.showLabels === 'boolean' && state.showLabels !== showLabels) {
        setToggleLabels(state.showLabels, true);
      }
      if (typeof state.showOrbits === 'boolean' && state.showOrbits !== showOrbits) {
        setToggleOrbits(state.showOrbits, true);
      }
      if (typeof state.isPlaying === 'boolean' && state.isPlaying !== isPlaying) {
        setTogglePlay(state.isPlaying, true);
      }
      if (typeof state.speedMultiplier === 'number' && state.speedMultiplier !== speedMultiplier) {
        setSpeedMultiplier(state.speedMultiplier, true);
      }
      if (state.activeFilter !== undefined && state.activeFilter !== activeFilter) {
        activeFilter = state.activeFilter;
        buildSelector();
        updateStatsBar();
      }

      if (state.lastAction && state.lastAction.type === 'top_view') {
        setTopView(true);
      } else if (state.lastAction && state.lastAction.type === 'close_info') {
        closeInfoPanel(true);
      } else if (state.lastAction && state.lastAction.type === 'select_target') {
        selectTarget(state.lastAction.targetId || state.focusedTarget, true);
      } else if (state.focusedTarget !== undefined && state.focusedTarget !== focusedTarget) {
        if (state.focusedTarget) {
          selectTarget(state.focusedTarget, true);
        } else {
          resetView(true);
        }
      }
    } finally {
      isSyncingRemoteState = false;
    }
  }
});

// ===== HOVER GLOW EFFECT =====
const hoverGlow = new THREE.Group();
scene.add(hoverGlow);
let currentHoveredObj = null;
// Create a multi-ring glow using additive sprites
const glowRingCount = 3;
const glowRings = [];
for (let g = 0; g < glowRingCount; g++) {
  const gGeo = new THREE.RingGeometry(1.5 + g * 0.6, 2.0 + g * 0.6, 32);
  const gMat = new THREE.MeshBasicMaterial({
    color: 0xffd700, transparent: true, opacity: 0,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const gMesh = new THREE.Mesh(gGeo, gMat);
  gMesh.lookAt(camera.position);
  hoverGlow.add(gMesh);
  glowRings.push({ mesh: gMesh, baseOpacity: 0.3 - g * 0.08 });
}
// Central glow sprite
const glowSpriteCanvas = document.createElement('canvas');
glowSpriteCanvas.width = 128; glowSpriteCanvas.height = 128;
const gsCtx = glowSpriteCanvas.getContext('2d');
const gsGrad = gsCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
gsGrad.addColorStop(0, 'rgba(255,215,0,0.6)');
gsGrad.addColorStop(0.3, 'rgba(255,200,50,0.3)');
gsGrad.addColorStop(1, 'rgba(255,180,0,0)');
gsCtx.fillStyle = gsGrad;
gsCtx.fillRect(0, 0, 128, 128);
const glowSpriteMap = new THREE.CanvasTexture(glowSpriteCanvas);
const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowSpriteMap, transparent: true, opacity: 0,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
glowSprite.scale.set(8, 8, 1);
hoverGlow.add(glowSprite);

renderer.domElement.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(allClickableMeshes, false);
  // Remove all hover-visible classes first
  document.querySelectorAll('.hover-visible').forEach(el => el.classList.remove('hover-visible'));
  if (intersects.length > 0 && !clickLock) {
    renderer.domElement.style.cursor = 'pointer';
    const obj = intersects[0].object;
    const colorHex = obj.userData.colorHex || '#ffd700';
    // Position glow at object
    const objPos = obj.getWorldPosition ? obj.getWorldPosition(new THREE.Vector3()) : obj.position.clone();
    if (obj.parent && obj.parent !== scene) objPos.copy(obj.parent.position);
    hoverGlow.position.copy(objPos);
    hoverGlow.visible = true;
    glowSprite.material.color.set(colorHex);
    glowRings.forEach(r => r.mesh.material.color.set(colorHex));
    currentHoveredObj = obj;
    // When labels are hidden, show the hovered one
    if (!showLabels) {
      if (obj.userData.isSun) {
        document.getElementById('sun-calligraphy-label').classList.add('hover-visible');
      } else {
        let targetLabel = null;
        const type = obj.userData.type;
        if (type === 'moon') {
          const idx = obj.userData.moonIndex;
          if (moonObjects[idx]) targetLabel = moonObjects[idx].label;
        } else {
          for (let i = 0; i < planetObjects.length; i++) {
            if (planetObjects[i].mesh === obj) { targetLabel = planetObjects[i].label; break; }
          }
          if (!targetLabel) {
            for (let i = 0; i < planetObjects.length; i++) {
              if (planetObjects[i].mesh === obj || (obj.parent && obj.parent === planetObjects[i].group)) {
                targetLabel = planetObjects[i].label; break;
              }
            }
          }
        }
        if (targetLabel) targetLabel.classList.add('hover-visible');
        if (type === 'child') {
          const childIdx = obj.userData.childIndex;
          miniMoons.forEach(m => {
            if (m.parentGroup === planetObjects[childIdx] && planetObjects[childIdx]) {
              m.label.classList.add('hover-visible');
            }
          });
        }
      }
    }
  } else {
    renderer.domElement.style.cursor = 'grab';
    hoverGlow.visible = false;
    currentHoveredObj = null;
  }
});

// ===== ANIMATION =====
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  sunMaterial.uniforms.time.value = elapsed;
  sunMesh.rotation.y += 0.001;

  // === PARALLAX STARS ===
  const camDelta = new THREE.Vector3().subVectors(camera.position, prevCameraPos);
  starLayers.forEach(layer => {
    layer.points.rotation.x += camDelta.y * layer.parallaxFactor * 0.01;
    layer.points.rotation.y += camDelta.x * layer.parallaxFactor * 0.01;
    // Subtle twinkling via opacity pulse
    layer.points.material.opacity += Math.sin(elapsed * 0.5 + layer.parallaxFactor * 100) * 0.001;
  });
  prevCameraPos.copy(camera.position);

  // === FILTER VISIBILITY ===
  // When a filter is active, ONLY show the selected group
  // Everything else (bodies, labels, orbit lines) is completely hidden
  const groupToOrbitIdx = { moons: -1, children: 0, wives: 1, relatives: 2, wetnurses: 3, mawali: 4, closeScribes: 5, promised: 6, battles: 7 };
  planetObjects.forEach(obj => {
    const visible = !activeFilter || obj.orbitType === activeFilter;
    obj.group.visible = visible;
  });
  // Hide/show orbit rings (8 main orbits from ORBITS_CONFIG, each with a glow duplicate)
  const orbitRingStartIdx = MOONS_DATA.length * 2; // each moon orbit has main+glow
  ORBITS_CONFIG.forEach((oc, ocIdx) => {
    const visible = !activeFilter || (groupToOrbitIdx[activeFilter] === ocIdx);
    const mainIdx = orbitRingStartIdx + ocIdx * 2;
    const glowIdx = orbitRingStartIdx + ocIdx * 2 + 1;
    if (allOrbitPaths[mainIdx]) allOrbitPaths[mainIdx].orbit.visible = visible;
    if (allOrbitPaths[glowIdx]) allOrbitPaths[glowIdx].orbit.visible = visible;
  });
  // Moon orbits and parents visibility
  const showMoonsFilter = !activeFilter || activeFilter === 'moons';
  moonObjects.forEach(obj => {
    obj.mesh.visible = showMoonsFilter;
  });
  // Moon orbit ring lines
  for (let mi = 0; mi < MOONS_DATA.length * 2; mi++) {
    if (allOrbitPaths[mi]) allOrbitPaths[mi].orbit.visible = showMoonsFilter;
  }
  // Belt particles visibility
  const showBattlesFilter = !activeFilter || activeFilter === 'battles';
  beltParticles.forEach(bp => {
    bp.mesh.visible = showBattlesFilter;
  });
  if (isPlaying) {
    moonObjects.forEach(obj => {
      obj.angle += obj.data.orbitSpeed * delta * 0.3 * speedMultiplier;
      obj.mesh.position.x = Math.cos(obj.angle) * obj.distance;
      obj.mesh.position.z = Math.sin(obj.angle) * obj.distance;
      obj.mesh.position.y = Math.sin(obj.angle) * Math.sin(obj.data.orbitTilt || 0) * obj.distance;
      obj.mesh.rotation.y += 0.01 * speedMultiplier;
    });

    planetObjects.forEach(obj => {
      obj.angle += obj.orbitSpeed * delta * 0.3 * speedMultiplier;
      obj.group.position.x = Math.cos(obj.angle) * obj.distance;
      obj.group.position.z = Math.sin(obj.angle) * obj.distance;
      obj.mesh.rotation.y += obj.rotSpeed * speedMultiplier;
    });

    // Mini-moons orbiting children
    miniMoons.forEach(m => {
      m.angle += m.speed * delta * speedMultiplier;
      m.mesh.position.x = Math.cos(m.angle) * m.distance;
      m.mesh.position.z = Math.sin(m.angle) * m.distance;
      m.mesh.position.y = Math.sin(m.angle * 0.5) * 0.3;
    });

    // Belt particles slow orbit
    beltParticles.forEach(bp => {
      bp.angle += bp.speed * delta * speedMultiplier;
      bp.mesh.position.x = Math.cos(bp.angle) * bp.distance;
      bp.mesh.position.z = Math.sin(bp.angle) * bp.distance;
      bp.mesh.rotation.x += bp.rotSpeed * speedMultiplier;
      bp.mesh.rotation.y += bp.rotSpeed * 0.7 * speedMultiplier;
    });

    // Battle debris orbit around their parent asteroids
    battleAsteroidMeshes.forEach(ba => {
      ba.debris.forEach((dMesh, di) => {
        const dAngle = (di / ba.debris.length) * Math.PI * 2 + elapsed * 0.5;
        const dDist = 2.5 + Math.sin(elapsed * 0.3 + di) * 0.5;
        dMesh.position.x = Math.cos(dAngle + di * 1.2) * dDist;
        dMesh.position.z = Math.sin(dAngle + di * 1.2) * dDist;
        dMesh.position.y = Math.sin(elapsed * 0.7 + di * 0.8) * 0.6;
      });
    });

    // Aurora particles around sun
    auroraParticles.forEach(ap => {
      const a = ap.baseAngle + elapsed * ap.speed;
      const r = ap.baseRadius + Math.sin(elapsed * ap.vertSpeed + ap.phase) * 1.5;
      ap.mesh.position.set(
        Math.cos(a) * r,
        ap.yOffset + Math.sin(elapsed * ap.vertSpeed * 0.7 + ap.phase) * 2,
        Math.sin(a) * r
      );
      ap.mesh.material.opacity = 0.2 + Math.sin(elapsed * 1.5 + ap.phase) * 0.15;
    });

    // Comet tails for battles
    cometTrails.forEach(ct => {
      const bIdx = ct.battleIndex;
      const battleOffset = CHILDREN_DATA.length + WIVES_DATA.length + UNCLES_AUNTS_DATA.length + WET_NURSES_DATA.length + MAWALI_SERVANTS_DATA.length + SCRIBES_DATA.length + CLOSE_COMPANIONS_DATA.length + PROMISED_PARADISE.length + bIdx;
      if (battleOffset < planetObjects.length) {
        const pObj = planetObjects[battleOffset];
        if (pObj) {
          const angle = pObj.angle;
          ct.trails.forEach((trail, ti) => {
            const trailAngle = angle - (ti + 1) * 0.06;
            const trailDist = pObj.distance + Math.sin(trailAngle * 3) * 0.5;
            trail.mesh.position.set(
              Math.cos(trailAngle) * trailDist,
              Math.sin(elapsed * 2 + ti * 0.5) * 0.3,
              Math.sin(trailAngle) * trailDist
            );
            trail.mesh.material.opacity = Math.max(0.05, (1 - ti / ct.trails.length) * 0.5 * (0.7 + Math.sin(elapsed * 3 + ti) * 0.3));
          });
        }
      }
    });
  }

  // Update explosions (runs even when paused for visual feedback)
  for (let ei = explosions.length - 1; ei >= 0; ei--) {
    const exp = explosions[ei];
    exp.age += delta;
    let allDead = true;
    exp.parts.forEach(p => {
      p.life -= p.decay * delta;
      if (p.life > 0) {
        allDead = false;
        p.mesh.position.add(p.vel.clone().multiplyScalar(delta));
        p.vel.multiplyScalar(0.96);
        if (p.isFlash) {
          p.mesh.scale.setScalar(Math.max(0.01, p.life * 2));
        }
        p.mesh.material.opacity = Math.max(0, p.life);
      } else {
        p.mesh.visible = false;
      }
    });
    if (allDead) {
      exp.parts.forEach(p => scene.remove(p.mesh));
      explosions.splice(ei, 1);
    }
  }

  if (cameraAnim) {
    cameraAnim.progress += delta * 1.2;
    const t = Math.min(1, cameraAnim.progress);
    const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    camera.position.lerpVectors(cameraAnim.startPos, cameraAnim.targetPos, ease);
    controls.target.lerpVectors(cameraAnim.startLook, cameraAnim.targetLook, ease);
    if (t >= 1) cameraAnim = null;
  } else if (focusedTarget !== null) {
    let targetPos;
    if (focusedTarget === 'sun') {
      targetPos = new THREE.Vector3(0, 0, 0);
      camera.position.lerp(new THREE.Vector3(0, 12, 35), 0.04);
    } else if (focusedTarget.startsWith('moon-')) {
      const idx = parseInt(focusedTarget.split('-')[1]);
      const obj = moonObjects[idx];
      targetPos = obj.mesh.getWorldPosition(new THREE.Vector3());
      const dist = Math.max(obj.data.radius * 6, 8);
      camera.position.lerp(targetPos.clone().add(new THREE.Vector3(0, obj.data.radius * 2, dist)), 0.035);
    } else {
      let obj;
      if (focusedTarget.startsWith('child-')) {
        obj = planetObjects[parseInt(focusedTarget.split('-')[1])];
      } else if (focusedTarget.startsWith('wife-')) {
        obj = planetObjects[CHILDREN_DATA.length + parseInt(focusedTarget.split('-')[1])];
      } else if (focusedTarget.startsWith('relative-')) {
        obj = planetObjects[CHILDREN_DATA.length + WIVES_DATA.length + parseInt(focusedTarget.split('-')[1])];
      } else if (focusedTarget.startsWith('wetnurse-')) {
        obj = planetObjects[CHILDREN_DATA.length + WIVES_DATA.length + UNCLES_AUNTS_DATA.length + parseInt(focusedTarget.split('-')[1])];
      } else if (focusedTarget.startsWith('mawali-')) {
        obj = planetObjects[CHILDREN_DATA.length + WIVES_DATA.length + UNCLES_AUNTS_DATA.length + WET_NURSES_DATA.length + parseInt(focusedTarget.split('-')[1])];
      } else if (focusedTarget.startsWith('scribe-')) {
        obj = planetObjects[CHILDREN_DATA.length + WIVES_DATA.length + UNCLES_AUNTS_DATA.length + WET_NURSES_DATA.length + MAWALI_SERVANTS_DATA.length + parseInt(focusedTarget.split('-')[1])];
      } else if (focusedTarget.startsWith('closecomp-')) {
        obj = planetObjects[CHILDREN_DATA.length + WIVES_DATA.length + UNCLES_AUNTS_DATA.length + WET_NURSES_DATA.length + MAWALI_SERVANTS_DATA.length + SCRIBES_DATA.length + parseInt(focusedTarget.split('-')[1])];
      } else if (focusedTarget.startsWith('promised-')) {
        obj = planetObjects[CHILDREN_DATA.length + WIVES_DATA.length + UNCLES_AUNTS_DATA.length + WET_NURSES_DATA.length + MAWALI_SERVANTS_DATA.length + SCRIBES_DATA.length + CLOSE_COMPANIONS_DATA.length + parseInt(focusedTarget.split('-')[1])];
      } else if (focusedTarget.startsWith('battle-')) {
        obj = planetObjects[CHILDREN_DATA.length + WIVES_DATA.length + UNCLES_AUNTS_DATA.length + WET_NURSES_DATA.length + MAWALI_SERVANTS_DATA.length + SCRIBES_DATA.length + CLOSE_COMPANIONS_DATA.length + PROMISED_PARADISE.length + parseInt(focusedTarget.split('-')[1])];
      }
      if (obj) {
        targetPos = obj.group.position.clone();
        const r = obj.data.radius || 0.7;
        const dist = Math.max(r * 8, 6);
        camera.position.lerp(targetPos.clone().add(new THREE.Vector3(0, r * 2.5, dist)), 0.035);
      }
    }
    if (targetPos) controls.target.lerp(targetPos, 0.06);
  }

  if (showLabels) {
    // Sun calligraphy label - always centered on the sun
    const sunScreenPos = new THREE.Vector3(0, 0, 0).project(camera);
    const sunLabel = document.getElementById('sun-calligraphy-label');
    if (sunScreenPos.z < 1 && sunLabel) {
      sunLabel.style.left = ((sunScreenPos.x * 0.5 + 0.5) * window.innerWidth) + 'px';
      sunLabel.style.top = ((-sunScreenPos.y * 0.5 + 0.5) * window.innerHeight - 12) + 'px';
      const sunDist = camera.position.length();
      sunLabel.style.fontSize = Math.min(28, Math.max(14, 350 / sunDist)) + 'px';
      sunLabel.style.display = 'block';
    } else if (sunLabel) {
      sunLabel.style.display = 'none';
    }

    moonObjects.forEach(obj => {
      const visible = !activeFilter || activeFilter === 'moons';
      if (!visible) { obj.label.style.display = 'none'; return; }
      const worldPos = obj.mesh.getWorldPosition(new THREE.Vector3());
      const pos = worldPos.clone().project(camera);
      if (pos.z < 1) {
        obj.label.style.display = 'block';
        obj.label.style.left = ((pos.x * 0.5 + 0.5) * window.innerWidth) + 'px';
        obj.label.style.top = ((-pos.y * 0.5 + 0.5) * window.innerHeight - 20) + 'px';
        if (showLabels) {
          const dist = camera.position.distanceTo(worldPos);
          obj.label.style.opacity = Math.min(1, Math.max(0.35, 100 / dist));
        }
      } else { obj.label.style.display = 'none'; }
    });
    planetObjects.forEach(obj => {
      const visible = !activeFilter || obj.orbitType === activeFilter;
      if (!visible) { obj.label.style.display = 'none'; return; }
      const pos = obj.group.position.clone().project(camera);
      if (pos.z < 1) {
        obj.label.style.display = 'block';
        obj.label.style.left = ((pos.x * 0.5 + 0.5) * window.innerWidth) + 'px';
        obj.label.style.top = ((-pos.y * 0.5 + 0.5) * window.innerHeight - 20) + 'px';
        if (showLabels) {
          const dist = camera.position.distanceTo(obj.group.position);
          obj.label.style.opacity = Math.min(1, Math.max(0.3, 80 / dist));
        }
      } else { obj.label.style.display = 'none'; }
    });
    // Mini-moon labels
    miniMoons.forEach(m => {
      const parentVisible = !activeFilter || activeFilter === 'children';
      if (!parentVisible || !m.parentGroup.visible) { m.label.style.display = 'none'; return; }
      const worldPos = new THREE.Vector3();
      m.mesh.getWorldPosition(worldPos);
      const pos = worldPos.clone().project(camera);
      if (pos.z < 1) {
        m.label.style.display = 'block';
        m.label.style.left = ((pos.x * 0.5 + 0.5) * window.innerWidth) + 'px';
        m.label.style.top = ((-pos.y * 0.5 + 0.5) * window.innerHeight - 20) + 'px';
        if (showLabels) {
          const dist = camera.position.distanceTo(worldPos);
          m.label.style.opacity = Math.min(1, Math.max(0.15, 40 / dist));
        }
      } else { m.label.style.display = 'none'; }
    });
  }

  // === HOVER GLOW ANIMATION ===
  if (hoverGlow.visible) {
    const glowPulse = 0.6 + Math.sin(elapsed * 4) * 0.4;
    glowSprite.material.opacity = 0.5 * glowPulse;
    glowRings.forEach((r, i) => {
      r.mesh.material.opacity = r.baseOpacity * glowPulse;
      r.mesh.rotation.z = elapsed * (0.3 + i * 0.15);
      r.mesh.lookAt(camera.position);
    });
    // Follow hovered object if it's moving
    if (currentHoveredObj) {
      const objPos = currentHoveredObj.parent && currentHoveredObj.parent !== scene
        ? currentHoveredObj.parent.position.clone()
        : currentHoveredObj.getWorldPosition(new THREE.Vector3());
      hoverGlow.position.lerp(objPos, 0.2);
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

// Toggle panel
const togglePanelBtn = document.getElementById('toggle-panel');
const planetSelector = document.getElementById('planet-selector');

function setSidePanelState(hide) {
  if (!planetSelector || !togglePanelBtn) return;
  if (hide) {
    planetSelector.classList.add('hidden-panel');
    togglePanelBtn.classList.add('panel-closed');
    togglePanelBtn.innerHTML = '◀';
    togglePanelBtn.setAttribute('title', 'إظهار القائمة الجانبية');
  } else {
    planetSelector.classList.remove('hidden-panel');
    togglePanelBtn.classList.remove('panel-closed');
    togglePanelBtn.innerHTML = '▶';
    togglePanelBtn.setAttribute('title', 'إخفاء القائمة الجانبية');
  }
}

if (togglePanelBtn && planetSelector) {
  togglePanelBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    const isHidden = planetSelector.classList.contains('hidden-panel');
    setSidePanelState(!isHidden);
  });
}

// ===== SEARCH SYSTEM (inside panel) =====
(function() {
  const allSearchableData = [];
  function registerSearchable(arr, type, colorFn) {
    arr.forEach((item, idx) => {
      allSearchableData.push({ name: item.name, nameEn: (item.nameEn || '').toLowerCase(), type: type, index: idx, colorHex: item.colorHex });
    });
  }
  registerSearchable(MOONS_DATA, 'moon', d => d.colorHex);
  registerSearchable(CHILDREN_DATA, 'child', d => d.colorHex);
  registerSearchable(WIVES_DATA, 'wife', d => d.colorHex);
  registerSearchable(UNCLES_AUNTS_DATA, 'relative', d => d.colorHex);
  registerSearchable(WET_NURSES_DATA, 'wetnurse', d => d.colorHex);
  registerSearchable(MAWALI_SERVANTS_DATA, 'mawali', d => d.colorHex);
  registerSearchable(SCRIBES_DATA, 'scribe', d => d.colorHex);
  registerSearchable(CLOSE_COMPANIONS_DATA, 'closecomp', d => d.colorHex);
  registerSearchable(PROMISED_PARADISE, 'promised', d => d.colorHex);
  registerSearchable(BATTLES_DATA, 'battle', d => d.colorHex);
  allSearchableData.push({ name: 'محمد ﷺ', nameEn: 'prophet muhammad', type: 'sun', index: 0, colorHex: '#ffd700' });

  const input = document.getElementById('panel-search-input');
  const results = document.getElementById('panel-search-results');
  if (!input || !results) return;

  input.addEventListener('input', function() {
    const q = this.value.trim();
    if (q.length < 2) { results.style.display = 'none'; return; }
    const matches = allSearchableData.filter(d => d.name.includes(q) || d.nameEn.includes(q.toLowerCase()));
    if (matches.length === 0) { results.style.display = 'none'; return; }
    results.innerHTML = '';
    matches.slice(0, 8).forEach(m => {
      const item = document.createElement('div');
      item.className = 'panel-search-item';
      item.innerHTML = '<span class="panel-search-dot" style="background:' + m.colorHex + '"></span><span>' + m.name + '</span>';
      item.addEventListener('click', () => {
        results.style.display = 'none';
        input.value = '';
        if (m.type === 'sun') selectSun();
        else if (m.type === 'moon') selectMoon(m.index);
        else if (m.type === 'child') selectChild(m.index);
        else if (m.type === 'wife') selectWife(m.index);
        else if (m.type === 'relative') selectRelative(m.index);
        else if (m.type === 'wetnurse') selectWetnurse(m.index);
        else if (m.type === 'mawali') selectMawali(m.index);
        else if (m.type === 'scribe') selectScribe(m.index);
        else if (m.type === 'closecomp') selectClosecomp(m.index);
        else if (m.type === 'promised') selectPromised(m.index);
        else if (m.type === 'battle') selectBattle(m.index);
      });
      results.appendChild(item);
    });
    results.style.display = 'block';
  });

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const firstItem = results.querySelector('.panel-search-item');
      if (firstItem) firstItem.click();
    } else if (e.key === 'Escape') {
      this.value = ''; results.style.display = 'none'; this.blur();
    }
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('#panel-search')) results.style.display = 'none';
  });
})();

// ===== AURORA EFFECT AROUND SUN =====
const auroraParticles = [];
(function() {
  const auroraCount = 60;
  for (let i = 0; i < auroraCount; i++) {
    const aGeo = new THREE.SphereGeometry(0.12 + Math.random() * 0.15, 6, 6);
    const hue = 0.08 + Math.random() * 0.12;
    const aMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(hue, 0.8, 0.6),
      transparent: true, opacity: 0.3 + Math.random() * 0.3,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const aMesh = new THREE.Mesh(aGeo, aMat);
    const baseAngle = (i / auroraCount) * Math.PI * 2;
    const baseRadius = 7 + Math.random() * 2;
    const yOffset = (Math.random() - 0.5) * 4;
    const speed = 0.2 + Math.random() * 0.3;
    const vertSpeed = 0.3 + Math.random() * 0.4;
    scene.add(aMesh);
    auroraParticles.push({ mesh: aMesh, baseAngle, baseRadius, yOffset, speed, vertSpeed, phase: Math.random() * Math.PI * 2 });
  }
})();

// ===== COMET TAILS FOR BATTLES =====
const cometTrails = [];
(function() {
  BATTLES_DATA.forEach((data, i) => {
    const trailCount = 12;
    const trails = [];
    for (let t = 0; t < trailCount; t++) {
      const tSize = Math.max(0.05, (1 - t / trailCount) * 0.4);
      const tGeo = new THREE.SphereGeometry(tSize, 6, 6);
      const tMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(data.colorHex),
        transparent: true, opacity: Math.max(0.05, (1 - t / trailCount) * 0.6),
        blending: THREE.AdditiveBlending, depthWrite: false
      });
      const tMesh = new THREE.Mesh(tGeo, tMat);
      scene.add(tMesh);
      trails.push({ mesh: tMesh });
    }
    cometTrails.push({ trails, battleIndex: i });
  });
})();

// ===== STAR EXPLOSION ON CLICK =====
const explosions = [];
function createExplosion(position, colorHex) {
  const particleCount = 25;
  const parts = [];
  for (let i = 0; i < particleCount; i++) {
    const pGeo = new THREE.SphereGeometry(0.06 + Math.random() * 0.1, 4, 4);
    const pMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(colorHex),
      transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const pMesh = new THREE.Mesh(pGeo, pMat);
    pMesh.position.copy(position);
    const vel = new THREE.Vector3(
      (Math.random() - 0.5) * 6,
      (Math.random() - 0.5) * 6,
      (Math.random() - 0.5) * 6
    );
    scene.add(pMesh);
    parts.push({ mesh: pMesh, vel: vel, life: 1.0, decay: 0.8 + Math.random() * 0.6 });
  }
  const flashGeo = new THREE.SphereGeometry(1.5, 12, 12);
  const flashMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(colorHex), transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const flashMesh = new THREE.Mesh(flashGeo, flashMat);
  flashMesh.position.copy(position);
  scene.add(flashMesh);
  parts.push({ mesh: flashMesh, vel: new THREE.Vector3(0,0,0), life: 1.0, decay: 3.0, isFlash: true });
  explosions.push({ parts: parts, age: 0 });
}
