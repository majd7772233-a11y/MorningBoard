<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دورة المياه في الطبيعة - 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0288d1;
            --accent-color: #ffca28;
            --text-color: #ffffff;
            --bg-glass: rgba(0, 0, 0, 0.6);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Tajawal', sans-serif;
            background-color: #87CEEB;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* واجهة المستخدم */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            pointer-events: auto;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 50px;
            align-self: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            margin: 0;
            color: var(--text-color);
            font-size: 1.8rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* لوحة التحكم */
        .controls-panel {
            pointer-events: auto;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            width: 300px;
            max-width: 90%;
            align-self: flex-start;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 20px;
            animation: slideInRight 1s ease-out;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* مفاتيح التبديل */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* شرح المراحل */
        .stages-info {
            pointer-events: auto;
            align-self: flex-end;
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .stage-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 12px;
            color: white;
            text-align: center;
            border-right: 4px solid var(--accent-color);
            transition: transform 0.3s, background 0.3s;
            max-width: 150px;
            animation: fadeInUp 1s ease-out;
        }

        .stage-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
        }

        .stage-card h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: var(--accent-color);
        }

        .stage-card p {
            margin: 0;
            font-size: 0.85rem;
            line-height: 1.3;
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0277bd;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 9999;
            font-size: 1.5rem;
            transition: opacity 0.5s;
        }

        /* Language Toggle */
        #btnLangToggle {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 500;
            padding: 10px 24px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.6);
            background: rgba(2, 136, 209, 0.75);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
            pointer-events: auto;
        }
        #btnLangToggle:hover { background: rgba(2, 136, 209, 1); transform: translateX(-50%) scale(1.05); }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Media Queries */
        @media (max-width: 768px) {
            .controls-panel {
                width: 100%;
                align-self: center;
            }
            .stages-info {
                width: 100%;
                justify-content: center;
                align-self: center;
            }
            header {
                width: 90%;
            }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- زر تغيير اللغة ثابت في المنتصف -->
    <button id="btnLangToggle" onclick="toggleLang()">🌐 English</button>

    <div id="loader" id="loader-text">جاري تحويل المشهد...</div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <header>
            <h1 id="main-title">دورة المياه في الطبيعة</h1>
        </header>

        <div style="display: flex; justify-content: space-between; width: 100%; align-items: flex-start;">
            <aside class="controls-panel">
                <h2 id="panel-title" style="margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 10px;">لوحة التحكم</h2>
                
                <div class="control-group">
                    <label>
                        <span id="lbl-sun">حرارة الشمس</span>
                        <label class="switch">
                            <input type="checkbox" id="sun-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </label>
                </div>

                <div class="control-group">
                    <label>
                        <span id="lbl-evap">التبخر</span>
                        <label class="switch">
                            <input type="checkbox" id="evap-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </label>
                </div>

                <div class="control-group">
                    <label>
                        <span id="lbl-cloud">السحب والتكثف</span>
                        <label class="switch">
                            <input type="checkbox" id="cloud-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </label>
                </div>

                <div class="control-group">
                    <label>
                        <span id="lbl-rain">هطول الأمطار</span>
                        <label class="switch">
                            <input type="checkbox" id="rain-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </label>
                </div>

                <div id="lbl-mouse" style="font-size: 0.8rem; opacity: 0.8; margin-top: 10px;">
                    استخدم الماوس للدوران والتقريب (اسحب، قرصة)
                </div>
            </aside>

            <div class="stages-info">
                <div class="stage-card">
                    <h3 id="stage1-title">1. التبخر</h3>
                    <p id="stage1-desc">تحول الماء لبخار بفعل حرارة الشمس.</p>
                </div>
                <div class="stage-card">
                    <h3 id="stage2-title">2. التكثف</h3>
                    <p id="stage2-desc">تجمع البخار وتكون السحب.</p>
                </div>
                <div class="stage-card">
                    <h3 id="stage3-title">3. الهطول</h3>
                    <p id="stage3-desc">سقوط المطر من السحب.</p>
                </div>
                <div class="stage-card">
                    <h3 id="stage4-title">4. التجمع</h3>
                    <p id="stage4-desc">عودة المياه للمحيطات والأنهار.</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration & State ---
        const config = {
            sunIntensity: 1.5,
        };

        const state = {
            sunActive: true,
            evaporationActive: true,
            cloudsActive: true,
            rainActive: true
        };

        // --- Init Scene ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB');
        scene.fog = new THREE.Fog('#87CEEB', 20, 100);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 60); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 100;

        window.camera = camera;
        window.controls = controls;
        window.scene = scene;
        window.renderer = renderer;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffdfba, config.sunIntensity);
        sunLight.position.set(20, 30, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 100;
        sunLight.shadow.camera.left = -30;
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -30;
        scene.add(sunLight);

        const sunGeometry = new THREE.SphereGeometry(3, 32, 32);
        const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        const sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
        sunMesh.position.copy(sunLight.position);
        scene.add(sunMesh);

        // --- Objects: Island (Land & Mountains) ---
        const islandGroup = new THREE.Group();
        scene.add(islandGroup);

        const landGeo = new THREE.CylinderGeometry(16, 20, 4, 12);
        const landMat = new THREE.MeshStandardMaterial({ color: 0x7cfc00, flatShading: true });
        const land = new THREE.Mesh(landGeo, landMat);
        land.position.y = 0; 
        land.receiveShadow = true;
        land.castShadow = true;
        islandGroup.add(land);

        const mountainGeo = new THREE.ConeGeometry(6, 8, 7);
        const mountainMat = new THREE.MeshStandardMaterial({ color: 0x6f6f6f, flatShading: true });
        const mountain = new THREE.Mesh(mountainGeo, mountainMat);
        mountain.position.set(-5, 4, -4);
        mountain.castShadow = true;
        mountain.receiveShadow = true;
        islandGroup.add(mountain);

        const snowGeo = new THREE.ConeGeometry(2.5, 2.5, 7);
        const snowMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true });
        const snow = new THREE.Mesh(snowGeo, snowMat);
        snow.position.set(-5, 7, -4);
        islandGroup.add(snow);

        // التجمع المائي (البحيرة)
        const lakeGeo = new THREE.CylinderGeometry(4.5, 4.5, 0.2, 16);
        const lakeMat = new THREE.MeshStandardMaterial({ 
            color: 0x0088cc, 
            transparent: true, 
            opacity: 0.9, 
            flatShading: true 
        });
        const lake = new THREE.Mesh(lakeGeo, lakeMat);
        lake.position.set(6, 2.1, 4); 
        islandGroup.add(lake);

        function addTree(x, z) {
            const trunkGeo = new THREE.CylinderGeometry(0.2, 0.4, 1.5, 5);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            
            const leavesGeo = new THREE.ConeGeometry(1.5, 3, 5);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x228B22, flatShading: true });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 2;

            const treeGroup = new THREE.Group();
            treeGroup.add(trunk);
            treeGroup.add(leaves);
            
            treeGroup.position.set(x, 2, z);
            treeGroup.castShadow = true;
            
            const s = 0.8 + Math.random() * 0.5;
            treeGroup.scale.set(s, s, s);
            islandGroup.add(treeGroup);
        }

        addTree(2, 8);
        addTree(3, -7);
        addTree(10, -2);
        addTree(-10, 4);
        addTree(-8, -6);
        addTree(0, 3);


        // --- Objects: Ocean ---
        const waterGeo = new THREE.PlaneGeometry(200, 200, 64, 64);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x006994,
            roughness: 0.1,
            metalness: 0.1,
            flatShading: true
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.y = -2;
        water.receiveShadow = true;
        scene.add(water);

        const waterPositions = water.geometry.attributes.position.clone();

        // --- Objects: Clouds ---
        const cloudGroup = new THREE.Group();
        scene.add(cloudGroup);

        function createCloud(x, y, z, scale) {
            const cloudMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                flatShading: true,
                transparent: true,
                opacity: 0.9
            });
            const singleCloud = new THREE.Group();
            const geo = new THREE.IcosahedronGeometry(1, 0);
            
            const p1 = new THREE.Mesh(geo, cloudMat); p1.position.set(0, 0, 0); p1.scale.set(1.2, 0.8, 1);
            const p2 = new THREE.Mesh(geo, cloudMat); p2.position.set(1, 0.2, 0); p2.scale.set(1, 0.7, 0.8);
            const p3 = new THREE.Mesh(geo, cloudMat); p3.position.set(-1, 0.1, 0.2); p3.scale.set(0.9, 0.6, 0.9);
            const p4 = new THREE.Mesh(geo, cloudMat); p4.position.set(0.2, 0.5, -0.5); p4.scale.set(0.8, 0.8, 0.8);

            singleCloud.add(p1, p2, p3, p4);
            singleCloud.position.set(x, y, z);
            singleCloud.scale.set(scale, scale, scale);
            
            singleCloud.userData = { speed: (Math.random() * 0.02) + 0.01 };
            return singleCloud;
        }

        const clouds = [];
        clouds.push(createCloud(-10, 15, -5, 2));
        clouds.push(createCloud(5, 18, -8, 2.5));
        clouds.push(createCloud(15, 16, 2, 2.2));
        clouds.forEach(c => cloudGroup.add(c));


        // --- Particle Systems ---

        // 1. Evaporation
        const evapCount = 400;
        const evapGeo = new THREE.BufferGeometry();
        const evapPos = new Float32Array(evapCount * 3);
        const evapSpeeds = [];
        
        for(let i=0; i<evapCount; i++) {
            evapPos[i*3] = (Math.random() - 0.5) * 40;
            evapPos[i*3+1] = -2 + Math.random() * 2;
            evapPos[i*3+2] = (Math.random() - 0.5) * 40;
            evapSpeeds.push({
                y: Math.random() * 0.05 + 0.02,
                x: (Math.random() - 0.5) * 0.02,
                z: (Math.random() - 0.5) * 0.02
            });
        }
        
        evapGeo.setAttribute('position', new THREE.BufferAttribute(evapPos, 3));
        const evapMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.5,
            transparent: true,
            opacity: 0.6,
            map: createCircleTexture()
        });
        const evapSystem = new THREE.Points(evapGeo, evapMat);
        scene.add(evapSystem);

        // 2. Rain
        const rainCount = 1000;
        const rainGeo = new THREE.BufferGeometry();
        const rainPos = new Float32Array(rainCount * 3);
        const rainSpeeds = [];

        for(let i=0; i<rainCount; i++) {
            rainPos[i*3] = (Math.random() - 0.5) * 30; 
            rainPos[i*3+1] = 15 + Math.random() * 10;
            rainPos[i*3+2] = (Math.random() - 0.5) * 20;
            rainSpeeds[i] = { y: -(Math.random() * 0.2 + 0.1) };
        }

        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
        const rainMat = new THREE.PointsMaterial({
            color: 0xaaaaee,
            size: 0.3,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        const rainSystem = new THREE.Points(rainGeo, rainMat);
        rainSystem.visible = state.rainActive;
        scene.add(rainSystem);

        // 3. المياه الجارية المتصلة (النهر والشلال)
        // زيادة كبيرة في عدد الجزيئات لضمان تدفق مستمر غير متقطع
        const riverCount = 2500;
        const riverGeo = new THREE.BufferGeometry();
        const riverPos = new Float32Array(riverCount * 3);
        const riverSpeeds = [];

        // توزيع الجزيئات مبدئياً على طول المسار بالكامل لكي لا يكون هناك فراغ عند بدء التشغيل
        for(let i=0; i<riverCount; i++) {
            // المسار من البحيرة (x=6) إلى داخل المحيط (x=25)
            let startX = 6 + Math.random() * 19; 
            let startY = 2.1;
            
            // تحديد الارتفاع بناءً على مكان القطرة لتكوين الشلال فوراً
            if (startX > 15.5 && startX < 17.5) {
                // منحدر الشلال
                startY = 2.1 - ((startX - 15.5) / 2) * 4.1; 
            } else if (startX >= 17.5) {
                // المحيط
                startY = -2;
            }

            riverPos[i*3] = startX;
            riverPos[i*3+1] = startY;
            riverPos[i*3+2] = 3.5 + (Math.random() * 1.5); // عرض النهر
            
            riverSpeeds[i] = {
                x: (startX >= 17.5) ? 0.05 : (Math.random() * 0.04 + 0.04),
                y: (startX > 15.5 && startX < 17.5) ? -0.1 : 0,
                z: (Math.random() - 0.5) * 0.01
            };
        }

        riverGeo.setAttribute('position', new THREE.BufferAttribute(riverPos, 3));
        // تم تغيير اللون ليتطابق مع مياه البحيرة (أزرق مائي شفاف)
        const riverMat = new THREE.PointsMaterial({
            color: 0x0088cc,
            size: 0.45,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        const riverSystem = new THREE.Points(riverGeo, riverMat);
        scene.add(riverSystem);


        // --- Helpers ---
        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.beginPath();
            ctx.arc(16, 16, 15, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            controls.update();

            // 1. Animate Water Waves
            const positions = water.geometry.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                const x = waterPositions.getX(i);
                const y = waterPositions.getY(i);
                const z = 0.5 * Math.sin(x * 0.5 + time) * Math.cos(y * 0.3 + time * 0.8);
                positions.setZ(i, z);
            }
            positions.needsUpdate = true;
            water.rotation.z = time * 0.02;

            // 2. Animate Sun
            if (state.sunActive) {
                sunMesh.visible = true;
                sunLight.intensity = THREE.MathUtils.lerp(sunLight.intensity, config.sunIntensity, 0.1);
            } else {
                sunMesh.visible = false;
                sunLight.intensity = THREE.MathUtils.lerp(sunLight.intensity, 0.1, 0.05);
            }

            // 3. Animate Clouds
            if (state.cloudsActive) {
                cloudGroup.visible = true;
                clouds.forEach(c => {
                    c.position.x += c.userData.speed;
                    if(c.position.x > 30) {
                        c.position.x = -30;
                    }
                    c.position.y += Math.sin(time + c.position.x) * 0.005;
                });
            } else {
                cloudGroup.visible = false;
            }

            // 4. Animate Evaporation
            if (state.evaporationActive && state.sunActive) {
                evapSystem.visible = true;
                const ePos = evapSystem.geometry.attributes.position;
                for(let i=0; i<evapCount; i++) {
                    let y = ePos.getY(i);
                    y += evapSpeeds[i].y;
                    let x = ePos.getX(i);
                    x += evapSpeeds[i].x;
                    let z = ePos.getZ(i);
                    z += evapSpeeds[i].z;

                    if(y > 10) {
                        y = -2;
                        x = (Math.random() - 0.5) * 40;
                        z = (Math.random() - 0.5) * 40;
                    }
                    ePos.setXYZ(i, x, y, z);
                }
                ePos.needsUpdate = true;
            } else {
                evapSystem.visible = false;
            }

            // 5. Animate Rain
            if (state.rainActive && state.cloudsActive) {
                rainSystem.visible = true;
                const rPos = rainSystem.geometry.attributes.position;
                for(let i=0; i<rainCount; i++) {
                    let y = rPos.getY(i);
                    y += rainSpeeds[i].y;
                    let x = rPos.getX(i);
                    x += 0.02;

                    if(y < -2) {
                        y = 15 + Math.random() * 5;
                        x = (Math.random() - 0.5) * 30; 
                    }
                    if(x > 20) x = -20;
                    rPos.setXYZ(i, x, y, rPos.getZ(i));
                }
                rPos.needsUpdate = true;
            } else {
                rainSystem.visible = false;
            }

            // 6. الجريان المستمر للنهر والشلال
            if (state.rainActive) {
                riverSystem.visible = true;
                const rvPos = riverSystem.geometry.attributes.position;
                for(let i=0; i<riverCount; i++) {
                    let x = rvPos.getX(i);
                    let y = rvPos.getY(i);
                    let z = rvPos.getZ(i);

                    x += riverSpeeds[i].x;
                    y += riverSpeeds[i].y;
                    z += riverSpeeds[i].z;

                    // تطبيق الجاذبية بمجرد تخطي حافة اليابسة لتكوين الشلال
                    if (x > 15.5 && y > -2) {
                        riverSpeeds[i].y -= 0.008; 
                    }

                    // الاستقرار والجريان أفقياً بمجرد ملامسة المحيط
                    if (y <= -2) {
                        y = -2; 
                        riverSpeeds[i].y = 0; 
                        riverSpeeds[i].x = 0.06; // سرعة التدفق داخل المحيط
                    }

                    // إذا وصلت الجزيئات لنهاية المسار، يتم إعادة تدويرها فوراً للبداية (البحيرة) لتجنب التقطيع
                    if (x > 25) {
                        x = 6 + Math.random(); // تبدأ من داخل البحيرة
                        y = 2.1;
                        z = 3.5 + (Math.random() * 1.5);
                        riverSpeeds[i].x = Math.random() * 0.04 + 0.04;
                        riverSpeeds[i].y = 0;
                    }

                    rvPos.setXYZ(i, x, y, z);
                }
                rvPos.needsUpdate = true;
            } else {
                riverSystem.visible = false;
            }

            renderer.render(scene, camera);
        }

        // --- Event Listeners ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- M&S State Sync logic ---
        function sendStateToParent(action, data) {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'room3d_state_change',
                    roomType: 'water_cycle',
                    action: action,
                    data: data
                }, '*');
            }
        }

        document.getElementById('sun-toggle').addEventListener('change', (e) => {
            state.sunActive = e.target.checked;
            sendStateToParent('update_state', { sunActive: state.sunActive, evaporationActive: state.evaporationActive, cloudsActive: state.cloudsActive, rainActive: state.rainActive });
        });

        document.getElementById('evap-toggle').addEventListener('change', (e) => {
            state.evaporationActive = e.target.checked;
            sendStateToParent('update_state', { sunActive: state.sunActive, evaporationActive: state.evaporationActive, cloudsActive: state.cloudsActive, rainActive: state.rainActive });
        });

        document.getElementById('cloud-toggle').addEventListener('change', (e) => {
            state.cloudsActive = e.target.checked;
            sendStateToParent('update_state', { sunActive: state.sunActive, evaporationActive: state.evaporationActive, cloudsActive: state.cloudsActive, rainActive: state.rainActive });
        });

        document.getElementById('rain-toggle').addEventListener('change', (e) => {
            state.rainActive = e.target.checked;
            sendStateToParent('update_state', { sunActive: state.sunActive, evaporationActive: state.evaporationActive, cloudsActive: state.cloudsActive, rainActive: state.rainActive });
        });

        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data || data.type !== 'apply_room3d_state') return;

            if (data.action === 'update_state') {
                const s = data.data;
                if (s.sunActive !== undefined) {
                    state.sunActive = !!s.sunActive;
                    document.getElementById('sun-toggle').checked = state.sunActive;
                }
                if (s.evaporationActive !== undefined) {
                    state.evaporationActive = !!s.evaporationActive;
                    document.getElementById('evap-toggle').checked = state.evaporationActive;
                }
                if (s.cloudsActive !== undefined) {
                    state.cloudsActive = !!s.cloudsActive;
                    document.getElementById('cloud-toggle').checked = state.cloudsActive;
                }
                if (s.rainActive !== undefined) {
                    state.rainActive = !!s.rainActive;
                    document.getElementById('rain-toggle').checked = state.rainActive;
                }
            } else if (data.action === 'toggle_lang') {
                if (data.data.lang) {
                    toggleLangDirectly(data.data.lang);
                }
            }
        });

        window.onload = () => {
            const loader = document.getElementById('loader');
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            }, 1000);
        };

        animate();

    </script>

    <!-- ==================== LANGUAGE TOGGLE ==================== -->
    <script>
        const WATER_TRANSLATIONS = {
            ar: {
                btn: '🌐 English',
                title: 'دورة المياه في الطبيعة',
                panelTitle: 'لوحة التحكم',
                sun: 'حرارة الشمس',
                evap: 'التبخر',
                cloud: 'السحب والتكثف',
                rain: 'هطول الأمطار',
                mouse: 'استخدم الماوس للدوران والتقريب (اسحب، قرصة)',
                loader: 'جاري تحويل المشهد...',
                s1t: '1. التبخر', s1d: 'تحول الماء لبخار بفعل حرارة الشمس.',
                s2t: '2. التكثف', s2d: 'تجمع البخار وتكون السحب.',
                s3t: '3. الهطول', s3d: 'سقوط المطر من السحب.',
                s4t: '4. التجمع', s4d: 'عودة المياه للمحيطات والأنهار.'
            },
            en: {
                btn: '🌐 العربية',
                title: 'The Water Cycle in Nature',
                panelTitle: 'Controls',
                sun: 'Sun Heat',
                evap: 'Evaporation',
                cloud: 'Clouds & Condensation',
                rain: 'Precipitation',
                mouse: 'Use mouse to rotate & zoom (drag, pinch)',
                loader: 'Loading scene...',
                s1t: '1. Evaporation', s1d: 'Water turns to vapor due to sun heat.',
                s2t: '2. Condensation', s2d: 'Vapor collects and forms clouds.',
                s3t: '3. Precipitation', s3d: 'Rain falls from the clouds.',
                s4t: '4. Collection', s4d: 'Water returns to oceans and rivers.'
            }
        };

        let waterLang = (new URLSearchParams(window.location.search)).get('lang') || 'ar';

        function applyWaterLang() {
            const t = WATER_TRANSLATIONS[waterLang];
            const isEn = waterLang === 'en';
            document.documentElement.dir = isEn ? 'ltr' : 'rtl';
            document.getElementById('btnLangToggle').textContent = t.btn;
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('panel-title').textContent = t.panelTitle;
            document.getElementById('lbl-sun').textContent = t.sun;
            document.getElementById('lbl-evap').textContent = t.evap;
            document.getElementById('lbl-cloud').textContent = t.cloud;
            document.getElementById('lbl-rain').textContent = t.rain;
            document.getElementById('lbl-mouse').textContent = t.mouse;
            document.getElementById('stage1-title').textContent = t.s1t;
            document.getElementById('stage1-desc').textContent = t.s1d;
            document.getElementById('stage2-title').textContent = t.s2t;
            document.getElementById('stage2-desc').textContent = t.s2d;
            document.getElementById('stage3-title').textContent = t.s3t;
            document.getElementById('stage3-desc').textContent = t.s3d;
            document.getElementById('stage4-title').textContent = t.s4t;
            document.getElementById('stage4-desc').textContent = t.s4d;
        }

        function toggleLangDirectly(langVal) {
            waterLang = langVal;
            applyWaterLang();
        }

        function toggleLang() {
            waterLang = waterLang === 'ar' ? 'en' : 'ar';
            applyWaterLang();
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'room3d_state_change',
                    roomType: 'water_cycle',
                    action: 'toggle_lang',
                    data: { lang: waterLang }
                }, '*');
            }
        }

        // Apply on load
        document.addEventListener('DOMContentLoaded', applyWaterLang);
    </script>
